name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CGO_ENABLED: "0"
  GOAMD64: v1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: test
        run: go test ./...

      - name: build archives
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          commit="$(git rev-parse HEAD)"
          date="$(git log -1 --format=%cI)"
          ldflags="-s -w -X main.version=${tag} -X main.commit=${commit} -X main.date=${date}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            stage="build/${os}_${arch}"
            mkdir -p "$stage"
            exe=veduta
            if [ "$os" = windows ]; then exe=veduta.exe; fi
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "$stage/$exe" ./cmd/veduta
            cp LICENSE README.md "$stage/"
            name="veduta_${tag}_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd "$stage" && zip -q -X "../../dist/${name}.zip" "$exe" LICENSE README.md)
            else
              tar -C "$stage" -czf "dist/${name}.tar.gz" "$exe" LICENSE README.md
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          cat dist/checksums.txt

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a pre-release suffix (v0.2.0-rc.1) is published as a pre-release, so
          # GitHub keeps it out of /releases/latest and only the beta channel offers it.
          pre=""
          case "${GITHUB_REF_NAME}" in *-*) pre="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" $pre --generate-notes dist/*
