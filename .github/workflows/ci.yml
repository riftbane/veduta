name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GOAMD64: v1

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: [stable, oldstable]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go.sum has no third-party modules
        run: |
          if [ -s go.sum ]; then echo "go.sum must be empty (standard library only):"; cat go.sum; exit 1; fi

      - name: go test
        run: go test ./...

      - name: rasterizer benchmark (0 allocs/op gate)
        run: |
          go test -bench . -benchmem -benchtime=10x -run '^$' ./gfx/soft | tee bench.txt
          if grep -E '^Benchmark' bench.txt | grep -vqE '[[:space:]]0 allocs/op'; then
            echo "rasterizer benchmark allocates"; exit 1
          fi

      - name: cross-compile windows/amd64
        run: GOOS=windows GOARCH=amd64 go build ./...

      - name: cross-compile linux/amd64
        run: GOOS=linux GOARCH=amd64 go build ./...

      - name: cross-compile linux/arm64
        run: GOOS=linux GOARCH=arm64 go build ./...
