name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GOAMD64: v1

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: [stable, oldstable]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go.sum has no third-party modules
        run: |
          if [ -s go.sum ]; then echo "go.sum must be empty (standard library only):"; cat go.sum; exit 1; fi

      - name: go test
        run: go test ./...

      - name: rasterizer benchmark (0 allocs/op gate)
        run: |
          go test -bench . -benchmem -benchtime=10x -run '^$' ./gfx/soft | tee bench.txt
          if grep -E '^Benchmark' bench.txt | grep -vqE '[[:space:]]0 allocs/op'; then
            echo "rasterizer benchmark allocates"; exit 1
          fi

      - name: template smoke test (veduta init, Lua and Go, then veduta test)
        run: |
          go build -o "$RUNNER_TEMP/veduta${{ runner.os == 'Windows' && '.exe' || '' }}" ./cmd/veduta
          cd "$RUNNER_TEMP"
          ./veduta init tmp
          (cd tmp && ../veduta test)
          ./veduta init tmpgo --go --engine-dir "$GITHUB_WORKSPACE"
          (cd tmpgo && ../veduta test)

      - name: simulator window (Windows)
        if: runner.os == 'Windows'
        env:
          VEDUTA_DISPLAY_TEST: "1"
        run: go test -run TestSimulatorWindow -v ./platform/

      - name: install.ps1 installs, puts veduta on PATH, and a Lua game runs (Windows PowerShell and pwsh)
        if: runner.os == 'Windows' && matrix.go == 'stable'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # As a person runs it: the script's text through iex, in both PowerShells.
          $env:VEDUTA_CHANNEL = 'nightly'
          powershell -NoProfile -Command "Get-Content -Raw install.ps1 | iex"
          if ($LASTEXITCODE -eq 0) { throw 'an unknown channel was accepted' }
          $env:VEDUTA_CHANNEL = 'beta'
          $env:VEDUTA_HOME = Join-Path $env:RUNNER_TEMP 'veduta-inst'
          powershell -NoProfile -Command "Get-Content -Raw install.ps1 | iex; if (-not `$?) { exit 1 }"
          if ($LASTEXITCODE -ne 0) { throw 'install.ps1 failed in Windows PowerShell' }
          Get-Content -Raw install.ps1 | iex # again, in pwsh, over the first
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (@($userPath.Split(';') | Where-Object { $_ -ieq $env:VEDUTA_HOME }).Count -ne 1) { throw "PATH has the folder other than once: $userPath" }
          veduta version
          Set-Location $env:RUNNER_TEMP
          veduta init psgame
          Set-Location psgame
          veduta test
          if ($LASTEXITCODE -ne 0) { throw 'veduta test failed' }

      - name: install.sh installs from both channels
        if: runner.os == 'Linux'
        env:
          # Runners share addresses, and the anonymous GitHub API refuses them with 403;
          # install.sh sends this to the API only.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sh -n install.sh
          # The installer exits non-zero here on purpose, and this step runs with
          # pipefail: take its output first, then look at it.
          out="$(sh install.sh --channel nightly 2>&1 || true)"
          printf '%s\n' "$out" | grep -q 'want stable or beta'
          for ch in stable beta; do
            sh install.sh --channel "$ch" --prefix "$RUNNER_TEMP/inst-$ch" --no-go --yes
            "$RUNNER_TEMP/inst-$ch/veduta" version
          done

      - name: cross-compile windows/amd64
        run: GOOS=windows GOARCH=amd64 go build ./...

      - name: cross-compile darwin/arm64
        run: GOOS=darwin GOARCH=arm64 go build ./...

      - name: cross-compile linux/amd64
        run: GOOS=linux GOARCH=amd64 go build ./...

      - name: cross-compile linux/arm64
        run: GOOS=linux GOARCH=arm64 go build ./...

  arm64:
    # The console is linux/arm64. The goldens are recorded on amd64, so running the whole
    # suite here is what proves they reproduce on the architecture that plays the games;
    # a cross-compile only proves that the code builds.
    name: test (linux/arm64 under qemu-user, go stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: install qemu-user
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static >/dev/null

      - name: go test (linux/arm64)
        env:
          GOARCH: arm64
        run: go test -exec qemu-aarch64-static ./...
